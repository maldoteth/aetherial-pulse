<!doctype html>
<html lang="en">
  <head>
    <script type="module">
      import { Buffer } from 'buffer'
      import process from 'process'
      window.Buffer = Buffer
      window.process = process
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fansite</title>
    <meta name="description" content="fansite — your social media platform.">
    <meta name="author" content="fansite" />
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://fansite.app/">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fansite" />
    <meta property="og:title" content="fansite" />
    <meta property="og:description" content="fansite — your social media platform." />
    <meta property="og:url" content="https://fansite.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="fansite" />
    <meta name="twitter:description" content="fansite — your social media platform." />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Preconnect -->
    <link rel="preconnect" href="https://api.web3auth.io">
    <link rel="preconnect" href="https://pulse.walletconnect.org">
    <link rel="preconnect" href="https://api.web3modal.org">
    <!-- DNS prefetch for secondary origins (cheaper, no open connection kept alive) -->
    <link rel="dns-prefetch" href="https://aigxuutjaqsywioxjefr.supabase.co">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- LCP: header logo — same URL as DesktopSidebar / MobileHeader so browser discovers early -->
    <link rel="preload" as="image" href="/dehub-header-logo.png" fetchpriority="high">

    <!-- Exo font: non-blocking load (avoids @import in index.css blocking Tailwind parse / main thread) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700;900&display=swap" />
    </noscript>

    <!-- Critical CSS — prevents white flash and CLS from unstyled root -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; width: 100%; background-color: #000; color: #fff; }
      #root { height: 100%; min-height: 100dvh; }
    </style>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
